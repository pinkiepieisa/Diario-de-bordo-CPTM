# Postgres local, só para testes: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cptm
      POSTGRES_PASSWORD: cptm_senha
      POSTGRES_DB: diario_cptm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
